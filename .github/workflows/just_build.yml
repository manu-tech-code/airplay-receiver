name: Just Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: apk
            task: assembleRelease
            path: app/build/outputs/apk/release/app-release.apk
          - artifact: aab
            task: bundleRelease
            path: app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4

      - name: Use JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      # Fail loudly and early: without these, `base64 -d` silently writes a junk
      # keystore and the build fails much later with an opaque error.
      - name: Check signing secrets
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          missing=""
          [ -z "$STORE" ] && missing="$missing STORE"
          [ -z "$LOCAL" ] && missing="$missing LOCAL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Create them once with: ./scripts/ci-keystore.sh"
            exit 1
          fi

      - name: Build
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          set -euo pipefail
          printf '%s' "$STORE" | base64 -d > upload.jks
          printf '%s' "$LOCAL" | base64 -d > local.properties
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./gradlew
          # build.gradle.kts reads local.properties and signs the release
          # variant itself, so no separate signing action is required.
          ./gradlew ${{ matrix.task }} --stacktrace

      - name: Remove signing material
        if: always()
        run: rm -f upload.jks local.properties

      - name: Verify artifact is signed
        run: |
          set -euo pipefail
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          if [ "${{ matrix.artifact }}" = "apk" ]; then
            "/usr/local/lib/android/sdk/build-tools/$BT/apksigner" verify --print-certs "${{ matrix.path }}"
          else
            echo "aab signing is verified at Play upload time; checking the file exists"
            test -s "${{ matrix.path }}"
          fi

      - name: Upload (GitHub)
        uses: actions/upload-artifact@v7
        with:
          name: airplay-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.path }}
          if-no-files-found: error
