name: Generate APK

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "v*.*.*"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      # Only tag pushes and manual dispatch produce a release. Pushes to a
      # release/** branch just build artifacts -- the old awk split on "v"
      # yielded an empty version for branch names, creating a tag called "v".
      - name: Resolve version
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) raw="${{ inputs.version }}" ;;
            *)                 raw="${GITHUB_REF_NAME}" ;;
          esac
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${raw#v}"
            if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version '$raw' is not v<major>.<minor>.<patch>"
              exit 1
            fi
            echo "version=$version"  >> "$GITHUB_ENV"
            echo "publish=true"      >> "$GITHUB_ENV"
          else
            echo "publish=false" >> "$GITHUB_ENV"
            echo "Branch build ($raw); artifacts only, no release."
          fi

      # A tag that disagrees with the manifest ships a release whose in-app
      # version does not match its name.
      - name: Check tag matches versionName
        if: env.publish == 'true'
        run: |
          set -euo pipefail
          declared=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$declared" != "${{ env.version }}" ]; then
            echo "::error::Tag says ${{ env.version }} but app/build.gradle.kts versionName is $declared"
            exit 1
          fi
          echo "versionName $declared matches the tag"

      - name: Use JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Check signing secrets
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          missing=""
          [ -z "$STORE" ] && missing="$missing STORE"
          [ -z "$LOCAL" ] && missing="$missing LOCAL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Create them once with: ./scripts/ci-keystore.sh"
            exit 1
          fi

      - name: Build
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          set -euo pipefail
          printf '%s' "$STORE" | base64 -d > upload.jks
          printf '%s' "$LOCAL" | base64 -d > local.properties
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove signing material
        if: always()
        run: rm -f upload.jks local.properties

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          "/usr/local/lib/android/sdk/build-tools/$BT/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      # Checksums let anyone verify a downloaded artifact matches what CI built.
      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release.apk \
                    app/build/outputs/bundle/release/app-release.aab \
            | sed 's#.*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload (artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: airplay-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish (GitHub)
        if: env.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
